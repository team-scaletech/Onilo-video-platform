<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Radial / Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Icon Base -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="104" height="104" rx="28" fill="#030712" opacity="0.92" />

  <!-- Inner Subtle Grid & Glow Accent -->
  <circle cx="64" cy="64" r="38" fill="url(#bgGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Onilo Play Triangle Icon -->
  <path 
    d="M52 42.5C52 40.1 54.7 38.6 56.7 39.9L86.2 59.4C88 60.6 88 63.4 86.2 64.6L56.7 84.1C54.7 85.4 52 83.9 52 81.5V42.5Z" 
    fill="url(#playGrad)"
    filter="url(#glow)"
  />
</svg>
